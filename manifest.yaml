# 能力清单（安全声明）—— training-qat（长任务 3 · 阶段 4）
#
# 语义：本清单是**白名单**。未声明的 capability 一律视为"未声明所以拒绝"，
# 与"设计上不做"（not_provided）显式区分。
#
# 风险档沿用推理三插件与训练侧已固化的词表（同一台机器只应有一套）：
#   read   = R0/R1 只读，无沙箱要求，不需要确认令牌
#   write  = R1/R2 写操作，需沙箱（train/validate 声明 container）
#   system = R4 系统级，需 VM 级沙箱 —— 本机无 VM，故一律拒绝

name: @xiciyang/training-qat
version: 0.1.0
interface:
  mcp: "1.0.0"
  cli: "1.0.0"

capabilities:
  - id: prepare
    tool: training_qat_prepare
    risk: write
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: ['disk:write', 'state:read']
  - id: train
    tool: training_qat_train
    risk: write
    sandbox: container
    idempotent: false
    confirmation: required
    resources: ['gpu:write', 'disk:write', 'state:write', 'model:read']
  - id: validate
    tool: training_qat_validate
    risk: write
    sandbox: container
    idempotent: false
    confirmation: required
    resources: ['gpu:write', 'port:bind', 'state:write', 'model:read']
  - id: rollback
    tool: training_qat_rollback
    risk: write
    sandbox: none
    idempotent: true
    confirmation: required
    resources: ['disk:write', 'state:write']
  - id: get_report
    tool: training_qat_get_report
    risk: read
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: ['state:read']
  - id: health
    tool: training_qat_health
    risk: read
    sandbox: none
    idempotent: true
    confirmation: not-required
    resources: []

not_provided:
  - id: sft
    reason: 不做 SFT（归 training-sft）。QAT 只做量化感知训练。
  - id: pretrain
    reason: 不做预训练（归 training-pretrain）。
  - id: rl
    reason: 不做 RL/偏好优化（归 training-rl）。
  - id: emit_full_precision_model
    reason: QAT 是「主模型保持全精度」的**受控例外**（training-qat-contract §5.1）：它**必须**输出量化模型。除 QAT 外的训练插件一律全精度。
  - id: change_main_model
    reason: 基座模型只读；QAT 浮点权重与量化产物一律写到独立运行目录，量化前后对源模型做哈希校验。
  - id: declare_unproduced_scheme
    reason: 硬性不做：输出 `quantization_config` 里的方案**从产出读回**，绝不由调用方或插件"声明"。请求 8bit 而产出不是 8bit 即抛 E_SCHEME_DRIFT。qat.mjs:67 声明的 W4A16 本包不产出、也不声明。
  - id: w4a16_qat
    reason: 本机实测无可用 W4A16 QAT 路径（torchao 的 Int4WeightOnly convert 需 mslk>=1.0.0，本机未安装；见 out/qat-probe/step3b-convert-matrix.txt 与 step5-gpu.txt）。
  - id: distributed_training
    reason: v0 不做分布式（DDP/FSDP/TP/PP）；并发恒为 1。
  - id: touch_existing_endpoints
    reason: validate 只创建并拆解**自己租用**的端点；存量端点一律只读，绝不触碰。
  - id: synthesize_data
    reason: 硬性不做：不自行合成训练语料。
  - id: system_level_change
    reason: 不改宿主 OS/驱动/内核；vm 沙箱本机不可用，系统级动作一律拒绝。

dependencies:
  - name: inference-serving
    via: mcp
    purpose: validate 阶段的端点生命周期（deploy/teardown）—— 判定仪器必须是 serving
    required: true
  - name: inference-quantization
    via: mcp
    purpose: 跨插件对账：把真实 QAT 产出喂给 inference_quantization_validate（"验收已有 checkpoint"入口）
    required: false
  - name: training-qat/toolchain:0.1.0
    via: container
    purpose: 容器内 QAT 执行体（torchao QATConfig 假量化 + llmcompressor INT8 真量化）
    required: true
  - name: "@ai-infra/training-core"
    via: internal
    purpose: 公共单体循环 / 资源上限 / checkpoint / 产物指纹与空操作断言 / 审计钩子
    required: true
  - name: "@ai-infra/testing-core"
    via: internal
    purpose: 双重门禁（先判测量成立、再判数值）与均匀签名
    required: true
  - name: "@ai-infra/data-core"
    via: internal
    purpose: 去重 / 确定性切分 / O1 去泄漏 / 血缘
    required: true
  - name: "@ai-infra/state-core"
    via: internal
    purpose: qat-registry 方言与乐观并发写
    required: true
  - name: "@ai-infra/audit-core"
    via: internal
    purpose: QAT 审计哈希链
    required: true
  - name: "@ai-infra/sandbox-core"
    via: internal
    purpose: 沙箱层级行为探测与降级策略
    required: true

host:
  node: ">=20.11.0"
  runtimeDependencies: 0
